name: Hotdog OOS12 stock-first TWRP ColorOS

on:
  push:
    branches:
      - android-12.1-latest-snapshot
    paths:
      - ".github/workflows/build-recovery.yml"
      - "build/coloros/**"
      - "build/oos12/**"
      - "prebuilt/oos12/**"
      - "recovery/root/**"
      - "Android.bp"
      - "AndroidProducts.mk"
      - "BoardConfig.mk"
      - "bootctrl/**"
      - "device.mk"
      - "gpt-utils/**"
      - "recovery.fstab"
      - "security/**"
      - "system.prop"
      - "twrp_hotdog.mk"
      - "twrp.dependencies"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hotdog-coloros-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery-image:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      MANIFEST_URL: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
      MANIFEST_BRANCH: twrp-12.1
      MANIFEST_REVISION: 6dc117d9cbd08430daa16db2013560e1c4017fa8
      RECOVERY_REVISION: 5c3d206a5eeb3d446bcda8248a405a4b278bab5c
      VOLD_REVISION: a164ba05c5fef288059774a776b2e6e1119957cf
      SECURITY_REVISION: 14737db1429b8eebc15568bc748b2cd79ccad5c2
      NATIVE_REVISION: 89c808424fbce9e40c0d4e0d1920b3c64a191b7f
      QCOM_COMMON_REVISION: 2cf934339972feb6f711e5ad182b82157269c7f3
      QCOM_TWRP_COMMON_REVISION: 98506f7919102378c8d52ee7d6a94a867f1b4c55
      BUILD_MAKE_REVISION: 1b692e2248609f50a27c48cce53b7445cecdcfc5
      BUILD_SOONG_REVISION: c6c059ab28c8c67921c0838a994bb70d53594aa7
      VENDOR_TWRP_REVISION: 664ac3aa7a569d28d902734c741a629a59bab32d
      SYSTEM_CORE_REVISION: ac4f36c7eb076ea2c582061a21dfc49eaa71e623
      MKBOOTIMG_REVISION: b7c1a63df33e6763d2482bc9d33007f67706d131
      HARDWARE_INTERFACES_REVISION: ae469cee0dce6d71489588126a15da8e67a50102
      DEVICE_PATH: device/oneplus/hotdog
      BUILD_TARGET: recoveryimage
      RECOVERY_IMAGE_REL: out/target/product/hotdog/recovery.img
      RECOVERY_PARTITION_SIZE: "100663296"
      OOS12_MANIFEST_SHA256: 15c103f8a262b36ae75be41c06123a32c95b5498d9c0c16f969093f5735e5cf9
      PREBUILT_KERNEL_SHA256: 4b435ff44ed87d45a334f071d0af59f8579e8d0ac70ddd1bc4cdbf8ac39b2d6a
      PREBUILT_DTB_SHA256: 558825c788f86b64927ca1c254db8876d4d54a27d067db3ba8b53f1543a28618
      PREBUILT_DTBO_SHA256: 7187d1e64e79b1a9416b1fb332ef8d670cc59ad6dcacc6864db2ed2eec0fd5b7
      STOCK_RAMDISK_GZIP_SHA256: 97449f9d692985bd44305bd23fe59db34a3d26711d6aea25f4dc4b8398546aed
      STOCK_RAMDISK_RAW_SHA256: 7fe6263a5cc654b363ef010a3b140ea404393dbf992ca0580156357d6e7c46d0
      COMMONDCS_SHA256: b626c790281f66279136437ca7065b5c0318462407c11c2a6ec2af04dc35e5a6
      GATEKEEPER_ATTESTATION_SHA256: af002511be00e9400c4aab876a74a73b3c02f7246d2f0ba42de59d7a8ffab00b
      DISPLAYCONFIG_SHA256: 18b95c53abeb03ab67e8eadd2a2009730109a8f04302d37663176d906b806327
      HAPTIC_BASE_SHA256: c77f9450350bd0036674c67cea62fd12784fe00aba5bc9e01f3411782fac57db
      HAPTIC_RTP_SHA256: 36438cefa7206dac9ef150b613418d5912c3eb69ed4e0084798602985b43470d
      HAPTIC_40MS_SHA256: f1de14505c59a0d91db1f1b2cf7e58a276f949f61946273cefb001d59f780527
      HAPTIC_80MS_SHA256: 98fb90d52ddf8ce2e5825d057c67be0237d78e6c6df439c2d8fbceff136ab4ff
      QSEE_SPL_SHA256: 6be8b4a2944d427398f0cc5ca2f6e11a70327f32c0d78ac209720b074f297d89
      QSEE_OPS_SHA256: 9f59345ecb4e8957b30dc6eaeb50e25e494fdfd8fc6e0c780651fda9f6588dc5
      APEX_POLICY_TOOL_SHA256: 9837db9db475eb74b6715f081768cb6a1f2fb5a2b2ac15755686062501bace27
      AVBTOOL_SHA256: a9ec360fc5395db9b72d36c03af59ff984f4eefcc349dc32a556de7f8ed892ab
      BUILD_JOBS: "4"
      LC_ALL: C
      TZ: UTC

    steps:
      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bc binutils bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git git-lfs gnupg gperf imagemagick \
            lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev \
            liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush python3 rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev
          mkdir -p "$HOME/bin"
          curl --fail --location --retry 3 \
            https://storage.googleapis.com/git-repo-downloads/repo \
            --output "$HOME/bin/repo"
          chmod 0755 "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "TWRP CI"
          git config --global user.email "twrp-ci@users.noreply.github.com"
          sha256sum "$HOME/bin/repo" | tee "$GITHUB_WORKSPACE/repo-launcher.sha256"

      - name: Sync pinned TWRP source
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/twrp"
          cd "$RUNNER_TEMP/twrp"
          "$HOME/bin/repo" init --depth=1 \
            --manifest-url "$MANIFEST_URL" \
            --manifest-branch "$MANIFEST_BRANCH"

          manifest_actual="$(git -C .repo/manifests rev-parse HEAD)"
          test "$manifest_actual" = "$MANIFEST_REVISION"

          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/hotdog.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <extend-project name="android_bootable_recovery"
                            path="bootable/recovery"
                            revision="$RECOVERY_REVISION" />
            <extend-project name="android_system_vold"
                            path="system/vold"
                            revision="$VOLD_REVISION" />
            <extend-project name="android_system_security"
                            path="system/security"
                            revision="$SECURITY_REVISION" />
            <extend-project name="platform/frameworks/native"
                            path="frameworks/native"
                            revision="$NATIVE_REVISION" />
            <extend-project name="android_device_qcom_common"
                            path="device/qcom/common"
                            revision="$QCOM_COMMON_REVISION" />
            <extend-project name="android_device_qcom_twrp-common"
                            path="device/qcom/twrp-common"
                            revision="$QCOM_TWRP_COMMON_REVISION" />
            <extend-project name="android_build"
                            path="build/make"
                            revision="$BUILD_MAKE_REVISION" />
            <extend-project name="android_build_soong"
                            path="build/soong"
                            revision="$BUILD_SOONG_REVISION" />
            <extend-project name="android_vendor_twrp"
                            path="vendor/twrp"
                            revision="$VENDOR_TWRP_REVISION" />
            <extend-project name="android_system_core"
                            path="system/core"
                            revision="$SYSTEM_CORE_REVISION" />
            <extend-project name="platform/system/tools/mkbootimg"
                            path="system/tools/mkbootimg"
                            revision="$MKBOOTIMG_REVISION" />
            <extend-project name="android_hardware_interfaces"
                            path="hardware/interfaces"
                            revision="$HARDWARE_INTERFACES_REVISION" />
            <project path="$DEVICE_PATH"
                     name="${GITHUB_REPOSITORY}"
                     remote="github"
                     revision="${GITHUB_SHA}"
                     clone-depth="1" />
          </manifest>
          EOF

          "$HOME/bin/repo" sync --force-sync --no-clone-bundle --no-tags \
            --optimized-fetch --prune --fail-fast -j"$BUILD_JOBS"

      - name: Apply reviewed ColorOS patch set
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/twrp"
          patch_dir="$PWD/$DEVICE_PATH/build/coloros/patches"

          (
            cd "$patch_dir"
            sha256sum --check <<'EOF'
          8cef6cf7c0c7ec6f9fe14d990c2fee488bfab78135efe40313723ab1c9c8e412  apex-loop.patch
          bc1398b4901403a33d7ad80a171ba95974ba2c938558bc10b69ff350e8850895  binder.patch
          29ef6a93de27f17dfb741cc3bf93eaf063cefacd739a8625e1c9b8e3f668156c  keystore-service.patch
          be435c026ea0af8d979c71dde853f6920d68bab7a44a40a12b810e67da86a673  openaes.patch
          c196b8bd497039ae9ec7587212d47e0fe105867982b4ee06a02bbe30507b464e  recovery.patch
          0cd8269b20fa83fcfff42eee02a6a0be8a0d8a74bb2ee9baba8449dc26441523  security.patch
          452deadb4638086f1487df59e853dbba2bf295ab63da983232f5e9477b70a364  task-profiles.patch
          034b64defe6e7ff10b91e8948e0f2ac19da3a7f434bb03e9e6351fba283f2cda  vold.patch
          EOF
          ) | tee "$GITHUB_WORKSPACE/patch-checksums.txt"

          apply_patch() {
            local repository="$1"
            local patch="$2"
            git -C "$repository" apply --check --index --whitespace=error-all "$patch"
            git -C "$repository" apply --index --whitespace=error-all "$patch"
          }

          apply_patch bootable/recovery "$patch_dir/openaes.patch"
          apply_patch bootable/recovery "$patch_dir/apex-loop.patch"
          apply_patch bootable/recovery "$patch_dir/recovery.patch"
          apply_patch bootable/recovery "$patch_dir/keystore-service.patch"
          apply_patch system/core "$patch_dir/task-profiles.patch"
          apply_patch system/vold "$patch_dir/vold.patch"
          apply_patch system/security "$patch_dir/security.patch"
          apply_patch frameworks/native "$patch_dir/binder.patch"

          for repository in \
            bootable/recovery system/core system/vold system/security frameworks/native
          do
            git -C "$repository" diff --cached --check
          done

          expected_recovery_paths=$'Android.mk\netc/init/keystore2.rc\noplus_h40_credential_client.cpp\noplus_h40_credential_client.hpp\noplus_h40_credential_helper.cpp\noplus_h40_credential_protocol.hpp\noplus_h40_decrypt.cpp\noplus_h40_decrypt.hpp\npartitionmanager.cpp\nprebuilt/Android.mk\ntwrpApex.cpp'
          test "$(git -C bootable/recovery diff --cached --name-only | LC_ALL=C sort)" = \
            "$expected_recovery_paths"
          test "$(git -C system/core diff --cached --name-only)" = \
            'libprocessgroup/profiles/Android.bp'

          grep -Fq '[H40 V51 PARENT]' bootable/recovery/partitionmanager.cpp
          grep -Fq '[H40 PORTIDENTITY] using mounted dynamic system:' \
            bootable/recovery/oplus_h40_decrypt.cpp
          grep -Fq '/dev/block/mapper/system' \
            bootable/recovery/oplus_h40_decrypt.cpp
          grep -Fq '/dev/block/bootdevice/by-name/system' \
            bootable/recovery/oplus_h40_decrypt.cpp
          grep -Fq 'Decrypt_User_H40_Modern' system/vold/Decrypt.cpp
          grep -Fq 'direct-aes-minimal' system/vold/FsCrypt.cpp
          grep -Fq 'direct-aes-legacy-none' system/vold/FsCrypt.cpp
          grep -Fq '{"encrypted_key", "secdiscardable", "stretching", "version"}' \
            system/vold/FsCrypt.cpp
          grep -Fq '"stretching", 4, "none"' system/vold/FsCrypt.cpp
          grep -Fq '"secdiscardable", 1 << 14' system/vold/FsCrypt.cpp
          grep -Fq '[OPLUS V56 LAYOUT]' system/vold/FsCrypt.cpp
          grep -Fq 'GetKeyUpgradeLock()' system/vold/KeyStorage.cpp
          grep -Fq 'GetKeyDirsToCommit()' system/vold/KeyStorage.cpp
          grep -Fq 'malformed pKMblob prefix' system/vold/Keymaster.cpp
          grep -Fq 'H40_RECOVERY_KEYSTORE2_PERMISSION_SHIM_V51' \
            system/security/keystore2/src/utils.rs
          grep -Fq 'H40_RECOVERY_BINDER_STABILITY_V0_V52' \
            frameworks/native/libs/binder/Parcel.cpp
          grep -Fq '    disabled' bootable/recovery/etc/init/keystore2.rc
          grep -Fq 'LO_FLAGS_READ_ONLY | LO_FLAGS_AUTOCLEAR' \
            bootable/recovery/twrpApex.cpp
          grep -Fq 'makedev(7, num)' bootable/recovery/twrpApex.cpp
          grep -Fq 'allow kernel recovery:fd { use };' \
            bootable/recovery/sepolicy/twrp.te
          if grep -Fq 'on late-init' bootable/recovery/etc/init/keystore2.rc ||
             grep -Fq 'static std::mutex key_upgrade_lock;' system/vold/KeyStorage.cpp ||
             grep -Fq 'static std::vector<std::string> key_dirs_to_commit;' \
               system/vold/KeyStorage.cpp ||
             grep -Fq 'Using key directly' system/vold/Keymaster.cpp; then
            echo "forbidden legacy or early-service path survived the patch set" >&2
            exit 1
          fi

          for repository in \
            bootable/recovery system/core system/vold system/security frameworks/native
          do
            echo "$repository:"
            git -C "$repository" diff --cached --stat
          done | tee "$GITHUB_WORKSPACE/patch-diffstat.txt"

      - name: Verify source snapshot and Hotdog layout
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/twrp"
          "$HOME/bin/repo" manifest -r -o "$GITHUB_WORKSPACE/twrp-snapshot.xml"

          assert_revision() {
            local path="$1"
            local expected="$2"
            test "$(git -C "$path" rev-parse HEAD)" = "$expected"
          }

          assert_revision bootable/recovery "$RECOVERY_REVISION"
          assert_revision system/vold "$VOLD_REVISION"
          assert_revision system/security "$SECURITY_REVISION"
          assert_revision frameworks/native "$NATIVE_REVISION"
          assert_revision device/qcom/common "$QCOM_COMMON_REVISION"
          assert_revision device/qcom/twrp-common "$QCOM_TWRP_COMMON_REVISION"
          assert_revision build/make "$BUILD_MAKE_REVISION"
          assert_revision build/soong "$BUILD_SOONG_REVISION"
          assert_revision vendor/twrp "$VENDOR_TWRP_REVISION"
          assert_revision system/core "$SYSTEM_CORE_REVISION"
          assert_revision system/tools/mkbootimg "$MKBOOTIMG_REVISION"
          assert_revision hardware/interfaces "$HARDWARE_INTERFACES_REVISION"
          assert_revision "$DEVICE_PATH" "$GITHUB_SHA"

          printf '%s  %s\n' \
            "$OOS12_MANIFEST_SHA256" "$DEVICE_PATH/prebuilt/oos12/manifest.json" \
            "$PREBUILT_KERNEL_SHA256" "$DEVICE_PATH/prebuilt/oos12/kernel" \
            "$PREBUILT_DTB_SHA256" "$DEVICE_PATH/prebuilt/oos12/dtb.img" \
            "$PREBUILT_DTBO_SHA256" "$DEVICE_PATH/prebuilt/oos12/recovery-dtbo.img" \
            "$STOCK_RAMDISK_GZIP_SHA256" "$DEVICE_PATH/prebuilt/oos12/ramdisk-stock.cpio.gz" \
            "$COMMONDCS_SHA256" "$DEVICE_PATH/prebuilt/oos12/odm/lib64/vendor.oplus.hardware.commondcs@1.0.so" \
            "$GATEKEEPER_ATTESTATION_SHA256" "$DEVICE_PATH/prebuilt/oos12/system/lib64/libkeystore-attestation-application-id.so" \
            "$DISPLAYCONFIG_SHA256" "$DEVICE_PATH/prebuilt/oos12/vendor/lib64/libdisplayconfig.qti.so" \
            "$HAPTIC_BASE_SHA256" "$DEVICE_PATH/prebuilt/oos12/vendor/firmware/aw8697_haptic_170.bin" \
            "$HAPTIC_RTP_SHA256" "$DEVICE_PATH/prebuilt/oos12/vendor/firmware/aw8697_rtp.bin" \
            "$HAPTIC_40MS_SHA256" "$DEVICE_PATH/prebuilt/oos12/vendor/firmware/40ms_RTP_170Hz.bin" \
            "$HAPTIC_80MS_SHA256" "$DEVICE_PATH/prebuilt/oos12/vendor/firmware/80ms_RTP_170Hz.bin" \
            "$QSEE_SPL_SHA256" "$DEVICE_PATH/prebuilt/oos12/vendor/lib64/libspl.so" \
            "$QSEE_OPS_SHA256" "$DEVICE_PATH/prebuilt/oos12/vendor/lib64/libops.so" \
            "$APEX_POLICY_TOOL_SHA256" "$DEVICE_PATH/prebuilt/oos12/tools/hotdog-apex-policy" \
            "$AVBTOOL_SHA256" "$DEVICE_PATH/build/oos12/avbtool_android-12.1.0_r4.py" \
            | sha256sum --check - \
            | tee "$GITHUB_WORKSPACE/prebuilt-source-check.txt"
          python3 - "$DEVICE_PATH/prebuilt/oos12/manifest.json" <<'PY'
          import json
          import sys

          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          assert manifest["firmware"]["android_version"] == "12"
          assert manifest["stock_ramdisk_raw_sha256"] == (
              "7fe6263a5cc654b363ef010a3b140ea404393dbf992ca0580156357d6e7c46d0"
          )
          assert manifest["stock_ramdisk_entries"] == 711
          assert manifest["source_stock_recovery_bytes"] == 100663296
          PY

          if grep -Eq '<project[^>]+path="kernel/oneplus/' \
            "$GITHUB_WORKSPACE/twrp-snapshot.xml"; then
            echo "unexpected OnePlus kernel source project in manifest" >&2
            exit 1
          fi

          grep -Fq 'TW_INCLUDE_OPLUS_H40_DECRYPT := true' \
            "$DEVICE_PATH/BoardConfig.mk"
          test ! -e "$DEVICE_PATH/recovery/root/system/etc/task_profiles.json"
          for obsolete in \
            "$DEVICE_PATH/prebuilt/Image.gz" \
            "$DEVICE_PATH/prebuilt/dtb.img" \
            "$DEVICE_PATH/prebuilt/dtbo.img" \
            "$DEVICE_PATH/recovery/root/vendor" \
            "$DEVICE_PATH/recovery/root/system/bin/qseecomd" \
            "$DEVICE_PATH/recovery/root/system/bin/android.hardware.keymaster@4.0-service-qti"
          do
            test ! -e "$obsolete"
          done
          python3 -m py_compile "$DEVICE_PATH/build/oos12/"*.py
          git -C "$DEVICE_PATH" diff --check

          {
            echo "workflow_repository=${GITHUB_REPOSITORY}"
            echo "workflow_revision=${GITHUB_SHA}"
            echo "manifest=$MANIFEST_REVISION"
            echo "recovery=$RECOVERY_REVISION"
            echo "vold=$VOLD_REVISION"
            echo "security=$SECURITY_REVISION"
            echo "frameworks_native=$NATIVE_REVISION"
            echo "system_core=$SYSTEM_CORE_REVISION"
            echo "build_target=$BUILD_TARGET"
            echo "partition_model=dynamic-ab-dedicated-recovery"
            echo "kernel_source_project_synced=false"
            echo "recovery_baseline=oxygenos12-stock-first"
            echo "stock_recovery_sha256=3a776605346aca4e5e98f588e72a68cd38f8f01c782f573ff3efd26b93389916"
            echo "stock_ramdisk_raw_sha256=$STOCK_RAMDISK_RAW_SHA256"
            echo "commondcs_sha256=$COMMONDCS_SHA256"
            sha256sum "$DEVICE_PATH/build/coloros/patches/"*.patch
          } | tee "$GITHUB_WORKSPACE/build-provenance.txt"

      - name: Configure and assert Hotdog build
        run: |
          set -eo pipefail
          cd "$RUNNER_TEMP/twrp"
          export ALLOW_MISSING_DEPENDENCIES=true
          export BUILD_USERNAME=KAI-Miru
          export BUILD_HOSTNAME=github-actions
          source build/envsetup.sh
          lunch twrp_hotdog-eng

          assert_eq() {
            local name="$1"
            local expected="$2"
            local actual
            actual="$(get_build_var "$name")"
            if [[ "$actual" != "$expected" ]]; then
              echo "Expected $name=$expected, got '$actual'" >&2
              exit 1
            fi
          }

          assert_eq TARGET_PRODUCT twrp_hotdog
          assert_eq TARGET_DEVICE hotdog
          assert_eq TARGET_NO_KERNEL false
          assert_eq TARGET_NO_RECOVERY false
          assert_eq BOARD_USES_RECOVERY_AS_BOOT ""
          assert_eq TW_HAS_RECOVERY_PARTITION true
          assert_eq PRODUCT_USE_DYNAMIC_PARTITIONS true
          assert_eq PRODUCT_BUILD_SUPER_PARTITION false
          assert_eq BOARD_BOOT_HEADER_VERSION 2
          assert_eq BOARD_INCLUDE_RECOVERY_DTBO true
          assert_eq BOARD_RECOVERYIMAGE_PARTITION_SIZE "$RECOVERY_PARTITION_SIZE"
          assert_eq BOARD_SUPER_PARTITION_SIZE 15032385536
          assert_eq TW_INCLUDE_OPLUS_H40_DECRYPT true
          assert_eq TW_EXCLUDE_ENCRYPTED_BACKUPS true
          assert_eq TW_EXTRA_LANGUAGES true

          {
            for name in \
              TARGET_PRODUCT TARGET_DEVICE TARGET_ARCH PLATFORM_VERSION \
              TARGET_NO_KERNEL TARGET_NO_RECOVERY BOARD_USES_RECOVERY_AS_BOOT \
              TW_HAS_RECOVERY_PARTITION PRODUCT_USE_DYNAMIC_PARTITIONS \
              PRODUCT_BUILD_SUPER_PARTITION BOARD_SUPER_PARTITION_SIZE \
              BOARD_BOOT_HEADER_VERSION BOARD_INCLUDE_RECOVERY_DTBO \
              BOARD_RECOVERYIMAGE_PARTITION_SIZE TW_INCLUDE_OPLUS_H40_DECRYPT \
              TW_EXCLUDE_ENCRYPTED_BACKUPS TW_EXTRA_LANGUAGES \
              TARGET_PREBUILT_KERNEL TARGET_PREBUILT_DTB BOARD_PREBUILT_DTBOIMAGE
            do
              printf '%s=%s\n' "$name" "$(get_build_var "$name")"
            done
          } | tee "$GITHUB_WORKSPACE/build-configuration.txt"

      - name: Build dedicated recovery image
        id: build
        run: |
          set -eo pipefail
          cd "$RUNNER_TEMP/twrp"
          export ALLOW_MISSING_DEPENDENCIES=true
          export BUILD_USERNAME=KAI-Miru
          export BUILD_HOSTNAME=github-actions
          source build/envsetup.sh
          lunch twrp_hotdog-eng
          mka "$BUILD_TARGET" -j"$BUILD_JOBS" 2>&1 \
            | tee "$GITHUB_WORKSPACE/build.log"

      # Keep this directly after compilation. Later validation failures must
      # never hide a successfully linked recovery image or adapter binaries.
      - name: Stage compiled payload failsafe
        id: compiled_failsafe
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          product_root="$RUNNER_TEMP/twrp/out/target/product/hotdog"
          recovery_root="$product_root/recovery/root"
          destination="$RUNNER_TEMP/hotdog-coloros-compiled-intermediate"
          mkdir -p "$destination/system/bin" "$destination/system/lib64"
          image="$destination/COMPILED-INTERMEDIATE-DO-NOT-FLASH.img"
          install -m 0644 "$product_root/recovery.img" "$image"
          sha256sum "$image" > "$destination/COMPILED-INTERMEDIATE-DO-NOT-FLASH.img.sha256"
          cat > "$destination/DO-NOT-FLASH.txt" <<'EOF'
          COMPILED INTERMEDIATE - DO NOT FLASH

          This is the source-stage input to the OOS12 stock-first packager.
          It is uploaded only as a failsafe for build debugging. Download the
          OOS12 stock-first DEVICE-TEST artifact instead.

          Do not flash it from this CI result alone.
          EOF
          for name in recovery oplus_h40_credential_helper keystore2 linker64; do
            if test -f "$recovery_root/system/bin/$name"; then
              install -m 0755 "$recovery_root/system/bin/$name" \
                "$destination/system/bin/$name"
            fi
          done
          for name in libbinder.so libbinder_ndk.so; do
            if test -f "$recovery_root/system/lib64/$name"; then
              install -m 0644 "$recovery_root/system/lib64/$name" \
                "$destination/system/lib64/$name"
            fi
          done
          (
            cd "$destination"
            find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )

      - name: Upload compiled recovery image failsafe
        if: ${{ always() && steps.compiled_failsafe.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hotdog-COMPILED-INTERMEDIATE-DO-NOT-FLASH
          path: ${{ runner.temp }}/hotdog-coloros-compiled-intermediate/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Verify adapter and recovery image
        id: verify
        if: ${{ always() && steps.build.outcome == 'success' }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/twrp"
          product_root="out/target/product/hotdog"
          recovery_root="$product_root/recovery/root"
          recovery_image="$product_root/recovery.img"
          report="$GITHUB_WORKSPACE/elf-report"
          installed_task_profiles="$recovery_root/system/etc/task_profiles.json"

          for required in \
            "$recovery_image" \
            "$recovery_root/system/bin/recovery" \
            "$recovery_root/system/bin/oplus_h40_credential_helper" \
            "$recovery_root/system/bin/keystore2" \
            "$recovery_root/system/lib64/libbinder.so" \
            "$recovery_root/init.recovery.qcom_decrypt.rc" \
            "$recovery_root/init.recovery.qcom_decrypt.fbe.rc" \
            "$recovery_root/system/etc/init/keystore2.rc" \
            "$recovery_root/twres/splash.xml" \
            "$recovery_root/twres/images/mirumiru.png" \
            "$installed_task_profiles"
          do
            test -s "$required"
          done

          cmp system/core/libprocessgroup/profiles/task_profiles.json \
            "$installed_task_profiles"
          grep -Fq '    disabled' "$recovery_root/system/etc/init/keystore2.rc"
          if grep -Fq 'on late-init' "$recovery_root/system/etc/init/keystore2.rc"; then
            echo "keystore2 retained an unsafe early automatic start" >&2
            exit 1
          fi
          cmp "$DEVICE_PATH/recovery/root/twres/splash.xml" \
            "$recovery_root/twres/splash.xml"
          cmp "$DEVICE_PATH/recovery/root/twres/images/mirumiru.png" \
            "$recovery_root/twres/images/mirumiru.png"
          for marker in \
            '<image resource="mirumiru"/>' \
            '<text>TWRP %tw_version%</text>' \
            'Latest upstream 12.1 snapshot - 2025-09-02' \
            'Unofficial ColorOS Edition' \
            'OnePlus 7T Series - Hotdog Family'; do
            grep -Fq "$marker" "$recovery_root/twres/splash.xml"
          done

          bash "$DEVICE_PATH/build/coloros/verify-recovery-elf.sh" \
            "$recovery_root/system/bin/recovery" \
            "$recovery_root/system/bin/oplus_h40_credential_helper" \
            "$report"
          readelf --program-headers --wide \
            "$recovery_root/system/bin/oplus_h40_credential_helper" \
            > "$report/credential-helper.program-headers"
          strings -a "$recovery_root/system/bin/recovery" > "$report/recovery.strings"
          strings -a "$recovery_root/system/bin/keystore2" > "$report/keystore2.strings"
          strings -a "$recovery_root/system/lib64/libbinder.so" \
            > "$report/libbinder.strings"

          grep -Fq '[H40 V51 PARENT]' "$report/recovery.strings"
          grep -Fq '[H40 PORTIDENTITY] using mounted dynamic system:' \
            "$report/recovery.strings"
          grep -Fq '/dev/block/mapper/system' "$report/recovery.strings"
          grep -Fq 'H40_RECOVERY_KEYSTORE2_PERMISSION_SHIM_V51' \
            "$report/keystore2.strings"
          grep -Fq 'H40_RECOVERY_BINDER_STABILITY_V0_V52' \
            "$report/libbinder.strings"
          grep -Fq 'Requesting program interpreter: /system/bin/linker64' \
            "$report/credential-helper.program-headers"
          if grep -Fq 'Using key directly' "$report/recovery.strings" ||
             grep -Fq 'Trying %s wrappedkey' "$report/recovery.strings"; then
            echo "unsafe key fallback is present in the final recovery ELF" >&2
            exit 1
          fi

          bash "$DEVICE_PATH/build/coloros/verify-hotdog-recovery-image.sh" \
            "$RUNNER_TEMP/twrp" \
            "$recovery_image" \
            "$DEVICE_PATH/prebuilt/oos12/kernel" \
            "$DEVICE_PATH/prebuilt/oos12/dtb.img" \
            "$DEVICE_PATH/prebuilt/oos12/recovery-dtbo.img" \
            "$RECOVERY_PARTITION_SIZE" \
            "$GITHUB_WORKSPACE"

          echo 'ready: exact OOS12 stock ramdisk and audited OEM closure are packaged by the stock-first stage' \
            | tee "$GITHUB_WORKSPACE/coloros-runtime-readiness.txt"

      - name: Assemble and independently verify OOS12 stock-first image
        id: stock_first
        if: ${{ always() && steps.verify.outcome == 'success' }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/twrp"
          product_root="out/target/product/hotdog"
          recovery_image="$product_root/recovery.img"
          tools="$DEVICE_PATH/build/oos12"
          prebuilt="$DEVICE_PATH/prebuilt/oos12"
          work="$RUNNER_TEMP/hotdog-oos12-stock-first"
          ready="$RUNNER_TEMP/hotdog-oos12-stock-first-ready"
          mkdir -p "$work" "$ready"

          python3 "$tools/assemble_stock_boot_v2.py" \
            --prebuilt-dir "$prebuilt" \
            --manifest "$prebuilt/manifest.json" \
            --output "$work/stock-boot-payload.img" \
            --report "$work/stock-assemble.json"
          python3 "$tools/extract_boot_ramdisk.py" \
            --image "$work/stock-boot-payload.img" \
            --raw-cpio "$work/stock.cpio" \
            --report "$work/stock-extract.json"
          printf '%s  %s\n' "$STOCK_RAMDISK_RAW_SHA256" "$work/stock.cpio" \
            | sha256sum --check -

          python3 "$tools/extract_boot_ramdisk.py" \
            --image "$recovery_image" \
            --raw-cpio "$work/twrp.cpio" \
            --report "$work/twrp-extract.json"
          python3 "$tools/extract_newc_regulars.py" \
            --cpio "$work/stock.cpio" \
            --output "$work/stock-tree"
          python3 "$tools/extract_newc_regulars.py" \
            --cpio "$work/twrp.cpio" \
            --output "$work/twrp-tree"

          python3 "$tools/make_hotdog_stock_overlay.py" \
            --newc-dir "$tools" \
            --elf-audit-dir "$tools" \
            --stock-cpio "$work/stock.cpio" \
            --twrp-cpio "$work/twrp.cpio" \
            --firmware-dir "$prebuilt/vendor/firmware" \
            --qsee-lib-dir "$prebuilt/vendor/lib64" \
            --output "$work/stock-overlay.cpio" \
            --manifest "$work/stock-overlay.json"
          python3 "$tools/make_private_twrp_overlay.py" \
            --twrp-tree "$work/twrp-tree" \
            --twrp-cpio "$work/twrp.cpio" \
            --stock-cpio "$work/stock.cpio" \
            --stock-tree "$work/stock-tree" \
            --dlopen-root-manifest "$tools/h40-proprietary-manifest.json" \
            --elf-audit-dir "$tools" \
            --output "$work/private-overlay.cpio" \
            --manifest "$work/private-overlay.json" \
            --required-helper system/bin/minadbd \
            --required-helper system/bin/sload_f2fs \
            --required-helper system/bin/resize2fs \
            --required-helper system/bin/fastbootd \
            --required-helper system/bin/bu \
            --required-helper system/bin/pigz \
            --required-helper system/bin/unzip \
            --required-helper system/bin/keystore2 \
            --required-helper system/bin/keystore_cli_v2
          python3 "$tools/make_hotdog_cryptoeng_overlay.py" \
            --newc-dir "$tools" \
            --elf-audit-dir "$tools" \
            --stock-cpio "$work/stock.cpio" \
            --source "$prebuilt/odm/lib64/vendor.oplus.hardware.commondcs@1.0.so" \
            --output "$work/cryptoeng-overlay.cpio" \
            --manifest "$work/cryptoeng-overlay.json"
          chmod 0755 "$prebuilt/tools/hotdog-apex-policy"
          python3 "$tools/make_hotdog_runtime_overlay.py" \
            --newc-dir "$tools" \
            --elf-audit-dir "$tools" \
            --stock-cpio "$work/stock.cpio" \
            --twrp-cpio "$work/twrp.cpio" \
            --stock-tree "$work/stock-tree" \
            --twrp-tree "$work/twrp-tree" \
            --gatekeeper-attestation "$prebuilt/system/lib64/libkeystore-attestation-application-id.so" \
            --displayconfig "$prebuilt/vendor/lib64/libdisplayconfig.qti.so" \
            --policy-tool "$prebuilt/tools/hotdog-apex-policy" \
            --output "$work/runtime-overlay.cpio" \
            --manifest "$work/runtime-overlay.json"

          python3 "$tools/merge_newc.py" \
            --base "$work/stock.cpio" \
            --overlay "$work/stock-overlay.cpio" \
            --overlay "$work/private-overlay.cpio" \
            --overlay "$work/cryptoeng-overlay.cpio" \
            --overlay "$work/runtime-overlay.cpio" \
            --output "$work/hybrid.cpio" \
            --report "$work/merge.json"
          python3 "$tools/gzip_deterministic.py" \
            "$work/hybrid.cpio" "$work/hybrid.cpio.gz" \
            | tee "$work/gzip-report.json"
          python3 "$tools/repack_boot_v2.py" \
            --stock-boot "$work/stock-boot-payload.img" \
            --ramdisk "$work/hybrid.cpio.gz" \
            --output "$work/recovery-preavb.img" \
            --report "$work/repack.json"

          cp "$work/recovery-preavb.img" "$work/recovery.img"
          python3 "$tools/avbtool_android-12.1.0_r4.py" add_hash_footer \
            --image "$work/recovery.img" \
            --partition_name recovery \
            --partition_size "$RECOVERY_PARTITION_SIZE" \
            --algorithm NONE \
            --rollback_index 1 \
            --salt a4c2ab49d2e1d3f7bc804867c5bfb9e4730bebe18c9be9db732b9afc4eded952 \
            --prop 'com.android.build.recovery.fingerprint:qti/msmnile/msmnile:12/SKQ1.210216.001/1676623833591:user/release-keys' \
            --prop 'com.android.build.boot.os_version:12' \
            --prop 'com.android.build.boot.security_patch:2022-12-05' \
            --prop 'com.android.build.boot.security_patch:2022-12-05'
          python3 "$tools/avbtool_android-12.1.0_r4.py" verify_image \
            --image "$work/recovery.img" \
            | tee "$work/avb-verify.txt"
          python3 "$tools/avbtool_android-12.1.0_r4.py" info_image \
            --image "$work/recovery.img" \
            | tee "$work/avb-info.txt"

          python3 "$tools/verify_hotdog_stock_first.py" \
            --module-dir "$tools" \
            --stock-recovery "$work/stock-boot-payload.img" \
            --final-recovery "$work/recovery.img" \
            --stock-cpio "$work/stock.cpio" \
            --raw-ramdisk "$work/hybrid.cpio" \
            --gzip-ramdisk "$work/hybrid.cpio.gz" \
            --stock-patch-manifest "$work/stock-overlay.json" \
            --private-manifest "$work/private-overlay.json" \
            --cryptoeng-manifest "$work/cryptoeng-overlay.json" \
            --runtime-manifest "$work/runtime-overlay.json" \
            --report "$work/verification.json"

          output_name='hotdog-OOS12-stock-first-TWRP-ColorOS-RC1-TEST.img'
          install -m 0644 "$work/recovery.img" "$ready/$output_name"
          install -m 0644 \
            "$work/verification.json" \
            "$work/stock-assemble.json" \
            "$work/stock-overlay.json" \
            "$work/private-overlay.json" \
            "$work/cryptoeng-overlay.json" \
            "$work/runtime-overlay.json" \
            "$work/merge.json" \
            "$work/repack.json" \
            "$work/avb-info.txt" \
            "$ready/"
          cat > "$ready/DEVICE-TEST.txt" <<'EOF'
          HOTDOG OXYGENOS 12 STOCK-FIRST TWRP COLOROS IMAGE

          CI reconstructed the pinned OOS12 recovery baseline, injected the
          audited private TWRP/ColorOS runtime and exact dependency closure,
          added a test AVB hash footer, and independently verified the final
          96 MiB image. The image is ready for controlled device testing.
          EOF
          (
            cd "$ready"
            sha256sum "$output_name" > "$output_name.sha256"
            find . -type f ! -name SHA256SUMS -print0 | LC_ALL=C sort -z \
              | xargs -0 sha256sum > SHA256SUMS
          )

      - name: Upload OOS12 stock-first device-test image
        if: ${{ always() && steps.stock_first.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hotdog-OOS12-stock-first-TWRP-ColorOS-DEVICE-TEST
          path: ${{ runner.temp }}/hotdog-oos12-stock-first-ready/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hotdog-coloros-build-diagnostics
          path: |
            repo-launcher.sha256
            twrp-snapshot.xml
            patch-checksums.txt
            patch-diffstat.txt
            build-provenance.txt
            build-configuration.txt
            prebuilt-source-check.txt
            build.log
            recovery-unpack-info.txt
            recovery-component-sha256.txt
            recovery-image-layout.txt
            recovery-image.sha256
            coloros-runtime-readiness.txt
            elf-report/
            ${{ runner.temp }}/hotdog-oos12-stock-first/stock-assemble.json
            ${{ runner.temp }}/hotdog-oos12-stock-first/stock-extract.json
            ${{ runner.temp }}/hotdog-oos12-stock-first/twrp-extract.json
            ${{ runner.temp }}/hotdog-oos12-stock-first/gzip-report.json
            ${{ runner.temp }}/hotdog-oos12-stock-first/avb-verify.txt
          if-no-files-found: warn
          retention-days: 14
