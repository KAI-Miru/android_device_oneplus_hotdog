name: Build hotdog on pinned TWRP 12.1 snapshot

on:
  push:
    branches:
      - codex/hotdog-a12-minimal
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hotdog-twrp12-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recovery-image:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      MANIFEST_URL: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
      MANIFEST_BRANCH: twrp-12.1
      MANIFEST_REVISION: 6dc117d9cbd08430daa16db2013560e1c4017fa8
      RECOVERY_REVISION: 5c3d206a5eeb3d446bcda8248a405a4b278bab5c
      QCOM_COMMON_REVISION: 2cf934339972feb6f711e5ad182b82157269c7f3
      QCOM_TWRP_COMMON_REVISION: 98506f7919102378c8d52ee7d6a94a867f1b4c55
      BUILD_MAKE_REVISION: 1b692e2248609f50a27c48cce53b7445cecdcfc5
      BUILD_SOONG_REVISION: c6c059ab28c8c67921c0838a994bb70d53594aa7
      VENDOR_TWRP_REVISION: 664ac3aa7a569d28d902734c741a629a59bab32d
      SYSTEM_CORE_REVISION: ac4f36c7eb076ea2c582061a21dfc49eaa71e623
      SYSTEM_VOLD_REVISION: a164ba05c5fef288059774a776b2e6e1119957cf
      MKBOOTIMG_REVISION: b7c1a63df33e6763d2482bc9d33007f67706d131
      HARDWARE_INTERFACES_REVISION: ae469cee0dce6d71489588126a15da8e67a50102
      DEVICE_PATH: device/oneplus/hotdog
      BUILD_TARGET: recoveryimage
      RECOVERY_IMAGE_REL: out/target/product/hotdog/recovery.img
      RECOVERY_PARTITION_SIZE: "100663296"
      OPENAES_FIX_SHA256: be435c026ea0af8d979c71dde853f6920d68bab7a44a40a12b810e67da86a673
      TASK_PROFILES_FIX_SHA256: 452deadb4638086f1487df59e853dbba2bf295ab63da983232f5e9477b70a364
      PREBUILT_KERNEL_SHA256: 5cce136f5ebcede8ac03ae896dc64dc160c30c9ead981ae52d586e3598f578be
      PREBUILT_DTB_SHA256: 5fe452d09b59cf169662a0ec1f25a8d4ac9cd217852a28c8908a5b5c3860ad5a
      PREBUILT_DTBO_SHA256: bd9640691f9d543204deb107e92de4f8ecf117e52d79b79cead8de031450d465
      BUILD_JOBS: "4"
      LC_ALL: C
      TZ: UTC

    steps:
      - name: Free runner disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - name: Install build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bc binutils bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git git-lfs gnupg gperf imagemagick \
            lib32ncurses5-dev lib32readline-dev lib32z1-dev libelf-dev \
            liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev \
            libxml2 libxml2-utils lzop pngcrush python3 rsync schedtool \
            squashfs-tools xsltproc zip zlib1g-dev
          mkdir -p "$HOME/bin"
          curl --fail --location --retry 3 \
            https://storage.googleapis.com/git-repo-downloads/repo \
            --output "$HOME/bin/repo"
          chmod 0755 "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.name "TWRP CI"
          git config --global user.email "twrp-ci@users.noreply.github.com"
          sha256sum "$HOME/bin/repo" \
            | tee "$GITHUB_WORKSPACE/repo-launcher.sha256"
          df -h

      - name: Initialize pinned TWRP 12.1 inputs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/twrp"
          cd "$RUNNER_TEMP/twrp"
          "$HOME/bin/repo" init --depth=1 \
            --manifest-url "$MANIFEST_URL" \
            --manifest-branch "$MANIFEST_BRANCH"

          manifest_actual="$(git -C .repo/manifests rev-parse HEAD)"
          if [[ "$manifest_actual" != "$MANIFEST_REVISION" ]]; then
            echo "Expected manifest $MANIFEST_REVISION, got $manifest_actual" >&2
            echo "Review and update the snapshot pins explicitly before building." >&2
            exit 1
          fi

          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/hotdog.xml <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <extend-project name="android_bootable_recovery"
                            path="bootable/recovery"
                            revision="$RECOVERY_REVISION" />
            <extend-project name="android_device_qcom_common"
                            path="device/qcom/common"
                            revision="$QCOM_COMMON_REVISION" />
            <extend-project name="android_device_qcom_twrp-common"
                            path="device/qcom/twrp-common"
                            revision="$QCOM_TWRP_COMMON_REVISION" />
            <extend-project name="android_build"
                            path="build/make"
                            revision="$BUILD_MAKE_REVISION" />
            <extend-project name="android_build_soong"
                            path="build/soong"
                            revision="$BUILD_SOONG_REVISION" />
            <extend-project name="android_vendor_twrp"
                            path="vendor/twrp"
                            revision="$VENDOR_TWRP_REVISION" />
            <extend-project name="android_system_core"
                            path="system/core"
                            revision="$SYSTEM_CORE_REVISION" />
            <extend-project name="android_system_vold"
                            path="system/vold"
                            revision="$SYSTEM_VOLD_REVISION" />
            <extend-project name="platform/system/tools/mkbootimg"
                            path="system/tools/mkbootimg"
                            revision="$MKBOOTIMG_REVISION" />
            <extend-project name="android_hardware_interfaces"
                            path="hardware/interfaces"
                            revision="$HARDWARE_INTERFACES_REVISION" />
            <project path="$DEVICE_PATH"
                     name="${GITHUB_REPOSITORY}"
                     remote="github"
                     revision="${GITHUB_SHA}"
                     clone-depth="1" />
          </manifest>
          EOF

          "$HOME/bin/repo" sync --force-sync --no-clone-bundle --no-tags \
            --optimized-fetch --prune --fail-fast -j"$BUILD_JOBS"

      - name: Apply reviewed snapshot compatibility fixes
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/twrp"
          recovery_patch="$PWD/$DEVICE_PATH/ci/twrp12-openaes-fix.patch"
          profiles_patch="$PWD/$DEVICE_PATH/ci/twrp12-task-profiles-fix.patch"

          printf '%s  %s\n' \
            "$OPENAES_FIX_SHA256" "$recovery_patch" \
            "$TASK_PROFILES_FIX_SHA256" "$profiles_patch" \
            | sha256sum --check - \
            | tee "$GITHUB_WORKSPACE/snapshot-patches.sha256"

          git -C bootable/recovery apply --check --whitespace=error-all \
            "$recovery_patch"
          git -C bootable/recovery apply --whitespace=error-all \
            "$recovery_patch"
          git -C system/core apply --check --whitespace=error-all \
            "$profiles_patch"
          git -C system/core apply --whitespace=error-all \
            "$profiles_patch"

          test "$(git -C bootable/recovery diff --name-only | sort)" = \
            $'Android.mk\nprebuilt/Android.mk'
          test "$(git -C system/core diff --name-only)" = \
            'libprocessgroup/profiles/Android.bp'
          {
            echo 'bootable/recovery:'
            git -C bootable/recovery diff --stat
            echo 'system/core:'
            git -C system/core diff --stat
          } | tee "$GITHUB_WORKSPACE/snapshot-patch-paths.txt"

      - name: Verify and record source snapshot
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/twrp"
          "$HOME/bin/repo" manifest -r -o "$GITHUB_WORKSPACE/twrp-snapshot.xml"

          assert_revision() {
            local path="$1"
            local expected="$2"
            local actual
            actual="$(git -C "$path" rev-parse HEAD)"
            if [[ "$actual" != "$expected" ]]; then
              echo "Expected $path at $expected, got $actual" >&2
              exit 1
            fi
          }

          assert_revision bootable/recovery "$RECOVERY_REVISION"
          assert_revision device/qcom/common "$QCOM_COMMON_REVISION"
          assert_revision device/qcom/twrp-common "$QCOM_TWRP_COMMON_REVISION"
          assert_revision build/make "$BUILD_MAKE_REVISION"
          assert_revision build/soong "$BUILD_SOONG_REVISION"
          assert_revision vendor/twrp "$VENDOR_TWRP_REVISION"
          assert_revision system/core "$SYSTEM_CORE_REVISION"
          assert_revision system/vold "$SYSTEM_VOLD_REVISION"
          assert_revision system/tools/mkbootimg "$MKBOOTIMG_REVISION"
          assert_revision hardware/interfaces "$HARDWARE_INTERFACES_REVISION"
          assert_revision "$DEVICE_PATH" "$GITHUB_SHA"

          printf '%s  %s\n' \
            "$PREBUILT_KERNEL_SHA256" "$DEVICE_PATH/prebuilt/Image.gz" \
            "$PREBUILT_DTB_SHA256" "$DEVICE_PATH/prebuilt/dtb.img" \
            "$PREBUILT_DTBO_SHA256" "$DEVICE_PATH/prebuilt/dtbo.img" \
            | sha256sum --check - \
            | tee "$GITHUB_WORKSPACE/prebuilt-source-check.txt"
          sha256sum \
            "$DEVICE_PATH/prebuilt/Image.gz" \
            "$DEVICE_PATH/prebuilt/dtb.img" \
            "$DEVICE_PATH/prebuilt/dtbo.img" \
            "$DEVICE_PATH/recovery.fstab" \
            | tee "$GITHUB_WORKSPACE/source-fingerprints.sha256"

          if grep -Eq '<project[^>]+path="kernel/oneplus/' \
            "$GITHUB_WORKSPACE/twrp-snapshot.xml"
          then
            grep -E '<project[^>]+path="kernel/oneplus/' \
              "$GITHUB_WORKSPACE/twrp-snapshot.xml" \
              | tee "$GITHUB_WORKSPACE/kernel-source-project-scan.txt"
            echo "A OnePlus kernel source project was unexpectedly synced." >&2
            exit 1
          fi
          echo "absent: no kernel/oneplus source project is in the resolved manifest" \
            | tee "$GITHUB_WORKSPACE/kernel-source-project-scan.txt"

          git -C "$DEVICE_PATH" diff --check
          git -C bootable/recovery diff --check
          git -C system/core diff --check
          test ! -e "$DEVICE_PATH/recovery/root/system/etc/task_profiles.json"
          if LC_ALL=C grep -q $'\r' \
            "$DEVICE_PATH/recovery/root/system/bin/unified-script.sh"
          then
            echo "unified-script.sh contains CRLF bytes" >&2
            exit 1
          fi
          sh -n "$DEVICE_PATH/recovery/root/system/bin/unified-script.sh"
          awk '
            /^on / { section = $0 }
            /^[[:space:]]+start boot-hal-1-0[[:space:]]*$/ {
              count++
              if (section != "on fs") {
                print "boot-hal-1-0 starts under unexpected trigger: " section > "/dev/stderr"
                bad = 1
              }
            }
            END {
              if (count != 1) {
                print "expected exactly one boot-hal-1-0 start, got " count > "/dev/stderr"
                bad = 1
              }
              exit bad
            }
          ' "$DEVICE_PATH/recovery/root/init.recovery.qcom.rc"
          echo "pass: boot-hal-1-0 starts exactly once, under on fs" \
            | tee "$GITHUB_WORKSPACE/init-source-check.txt"
          {
            echo "workflow_repository=${GITHUB_REPOSITORY}"
            echo "workflow_revision=${GITHUB_SHA}"
            echo "manifest=$(git -C .repo/manifests rev-parse HEAD)"
            echo "recovery=$(git -C bootable/recovery rev-parse HEAD)"
            echo "vendor_twrp=$(git -C vendor/twrp rev-parse HEAD)"
            echo "build_make=$(git -C build/make rev-parse HEAD)"
            echo "build_soong=$(git -C build/soong rev-parse HEAD)"
            echo "system_core=$(git -C system/core rev-parse HEAD)"
            echo "system_vold=$(git -C system/vold rev-parse HEAD)"
            echo "mkbootimg=$(git -C system/tools/mkbootimg rev-parse HEAD)"
            echo "hardware_interfaces=$(git -C hardware/interfaces rev-parse HEAD)"
            echo "qcom_common=$(git -C device/qcom/common rev-parse HEAD)"
            echo "qcom_twrp_common=$(git -C device/qcom/twrp-common rev-parse HEAD)"
            echo "device=$(git -C "$DEVICE_PATH" rev-parse HEAD)"
            echo "openaes_fix_sha256=$OPENAES_FIX_SHA256"
            echo "task_profiles_fix_sha256=$TASK_PROFILES_FIX_SHA256"
            echo "build_target=$BUILD_TARGET"
            echo "kernel_source_project_synced=false"
            echo "kernel_build_target_requested=false"
            echo "prebuilt_kernel=$DEVICE_PATH/prebuilt/Image.gz"
            echo "prebuilt_dtb=$DEVICE_PATH/prebuilt/dtb.img"
            echo "prebuilt_recovery_dtbo=$DEVICE_PATH/prebuilt/dtbo.img"
          } | tee "$GITHUB_WORKSPACE/build-provenance.txt"

      - name: Configure and assert hotdog layout
        run: |
          # Android's envsetup functions intentionally probe unset variables and
          # are not compatible with Bash nounset mode.
          set -eo pipefail
          cd "$RUNNER_TEMP/twrp"
          # The minimal TWRP manifest intentionally omits CTS/VTS-only defaults.
          # Critical recovery outputs are asserted explicitly below and after build.
          export ALLOW_MISSING_DEPENDENCIES=true
          export BUILD_USERNAME=KAI-Miru
          export BUILD_HOSTNAME=github-actions
          source build/envsetup.sh
          lunch twrp_hotdog-eng

          assert_eq() {
            local name="$1"
            local expected="$2"
            local actual
            actual="$(get_build_var "$name")"
            if [[ "$actual" != "$expected" ]]; then
              echo "Expected $name=$expected, got '$actual'" >&2
              exit 1
            fi
          }
          assert_path() {
            local name="$1"
            local expected_rel="$2"
            local actual
            actual="$(get_build_var "$name")"
            if [[ "$actual" != "$expected_rel" && \
                  "$actual" != "$RUNNER_TEMP/twrp/$expected_rel" ]]; then
              echo "Expected $name=$expected_rel, got '$actual'" >&2
              exit 1
            fi
          }

          assert_eq TARGET_PRODUCT twrp_hotdog
          assert_eq TARGET_DEVICE hotdog
          assert_eq TARGET_NO_KERNEL false
          assert_eq TARGET_NO_RECOVERY false
          assert_eq BOARD_USES_RECOVERY_AS_BOOT ""
          assert_eq TW_HAS_RECOVERY_PARTITION true
          assert_eq PRODUCT_USE_DYNAMIC_PARTITIONS true
          assert_eq PRODUCT_BUILD_SUPER_PARTITION false
          assert_eq BOARD_BOOT_HEADER_VERSION 2
          assert_eq BOARD_INCLUDE_RECOVERY_DTBO true
          assert_eq BOARD_RECOVERYIMAGE_PARTITION_SIZE "$RECOVERY_PARTITION_SIZE"
          assert_eq BOARD_SUPER_PARTITION_SIZE 15032385536
          assert_eq TW_EXCLUDE_ENCRYPTED_BACKUPS true
          assert_eq TW_MAX_BRIGHTNESS 1023
          assert_eq TW_DEFAULT_BRIGHTNESS 200
          assert_eq TW_NO_SCREEN_BLANK true
          assert_eq TW_SCREEN_BLANK_ON_BOOT ""
          assert_path TARGET_PREBUILT_KERNEL "$DEVICE_PATH/prebuilt/Image.gz"
          assert_path TARGET_PREBUILT_DTB "$DEVICE_PATH/prebuilt/dtb.img"
          assert_path BOARD_PREBUILT_DTBOIMAGE "$DEVICE_PATH/prebuilt/dtbo.img"

          kernel_source="$(get_build_var TARGET_KERNEL_SOURCE)"
          if [[ -n "$kernel_source" && -e "$kernel_source" ]]; then
            echo "A kernel source path unexpectedly exists at '$kernel_source'" >&2
            exit 1
          fi

          {
            for name in \
              TARGET_PRODUCT \
              TARGET_DEVICE \
              TARGET_ARCH \
              PLATFORM_VERSION \
              TARGET_NO_KERNEL \
              TARGET_NO_RECOVERY \
              BOARD_USES_RECOVERY_AS_BOOT \
              TW_HAS_RECOVERY_PARTITION \
              PRODUCT_USE_DYNAMIC_PARTITIONS \
              PRODUCT_BUILD_SUPER_PARTITION \
              BOARD_SUPER_PARTITION_SIZE \
              BOARD_BOOT_HEADER_VERSION \
              BOARD_INCLUDE_RECOVERY_DTBO \
              BOARD_RECOVERYIMAGE_PARTITION_SIZE \
              TW_EXCLUDE_ENCRYPTED_BACKUPS \
              TW_MAX_BRIGHTNESS \
              TW_DEFAULT_BRIGHTNESS \
              TW_NO_SCREEN_BLANK \
              TW_SCREEN_BLANK_ON_BOOT \
              TARGET_PREBUILT_KERNEL \
              TARGET_PREBUILT_DTB \
              BOARD_PREBUILT_DTBOIMAGE \
              TARGET_KERNEL_SOURCE
            do
              printf '%s=%s\n' "$name" "$(get_build_var "$name")"
            done
            echo "BUILD_TARGET=$BUILD_TARGET"
          } | tee "$GITHUB_WORKSPACE/build-configuration.txt"

      - name: Build dedicated recovery image
        id: build
        shell: bash
        run: |
          # Keep nounset disabled while using Android's envsetup/build helpers.
          set -eo pipefail
          cd "$RUNNER_TEMP/twrp"
          export ALLOW_MISSING_DEPENDENCIES=true
          export BUILD_USERNAME=KAI-Miru
          export BUILD_HOSTNAME=github-actions
          source build/envsetup.sh
          lunch twrp_hotdog-eng
          mka "$BUILD_TARGET" -j"$BUILD_JOBS" 2>&1 \
            | tee "$GITHUB_WORKSPACE/build.log"

      - name: Verify packaged prebuilt components and image bounds
        id: verify
        if: steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/twrp"
          recovery_image="$RUNNER_TEMP/twrp/$RECOVERY_IMAGE_REL"
          recovery_root="out/target/product/hotdog/recovery/root"
          installed_task_profiles="$recovery_root/system/etc/task_profiles.json"
          for required in \
            "$recovery_root/system/bin/recovery" \
            "$recovery_root/system/bin/prepdecrypt.sh" \
            "$recovery_root/system/bin/qseecomd" \
            "$recovery_root/system/bin/android.hardware.keymaster@4.0-service-qti" \
            "$recovery_root/system/bin/android.hardware.gatekeeper@1.0-service-qti" \
            "$recovery_root/init.recovery.qcom_decrypt.rc" \
            "$recovery_root/init.recovery.qcom_decrypt.fbe.rc" \
            "$installed_task_profiles"
          do
            test -s "$required"
          done
          cmp system/core/libprocessgroup/profiles/task_profiles.json \
            "$installed_task_profiles"
          sha256sum \
            system/core/libprocessgroup/profiles/task_profiles.json \
            "$installed_task_profiles" \
            | tee "$GITHUB_WORKSPACE/task-profiles-check.sha256"
          readelf -d "$recovery_root/system/bin/recovery" \
            | tee "$GITHUB_WORKSPACE/recovery-dynamic-section.txt"
          if grep -Fq 'libopenaes.so' \
            "$GITHUB_WORKSPACE/recovery-dynamic-section.txt"
          then
            echo "recovery unexpectedly links excluded libopenaes.so" >&2
            exit 1
          fi
          bash "$DEVICE_PATH/ci/verify-hotdog-recovery-image.sh" \
            "$RUNNER_TEMP/twrp" \
            "$recovery_image" \
            "$DEVICE_PATH/prebuilt/Image.gz" \
            "$DEVICE_PATH/prebuilt/dtb.img" \
            "$DEVICE_PATH/prebuilt/dtbo.img" \
            "$RECOVERY_PARTITION_SIZE" \
            "$GITHUB_WORKSPACE"

          cp "$recovery_image" \
            "$GITHUB_WORKSPACE/twrp-hotdog-current-12.1-UNTESTED.img"
          sha256sum "$GITHUB_WORKSPACE/twrp-hotdog-current-12.1-UNTESTED.img" \
            | tee "$GITHUB_WORKSPACE/twrp-hotdog-current-12.1-UNTESTED.img.sha256"
          cat > "$GITHUB_WORKSPACE/UNTESTED.txt" <<'EOF'
          UNTESTED BUILD ARTIFACT

          This image only passed source, build, image-layout, and component-hash
          checks. It has not proven boot, display/touch, mounts, decryption,
          fastbootd, slot handling, or safe flashing on a phone.

          Do not flash it from this CI result alone.
          EOF

      - name: Upload untested recovery image
        if: steps.verify.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hotdog-current-twrp12-UNTESTED-recovery-image
          path: |
            twrp-hotdog-current-12.1-UNTESTED.img
            twrp-hotdog-current-12.1-UNTESTED.img.sha256
            UNTESTED.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload snapshot and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hotdog-current-twrp12-build-diagnostics
          path: |
            repo-launcher.sha256
            twrp-snapshot.xml
            build-provenance.txt
            build-configuration.txt
            prebuilt-source-check.txt
            source-fingerprints.sha256
            snapshot-patches.sha256
            snapshot-patch-paths.txt
            kernel-source-project-scan.txt
            init-source-check.txt
            build.log
            recovery-unpack-info.txt
            recovery-component-sha256.txt
            recovery-image-layout.txt
            recovery-image.sha256
            recovery-dynamic-section.txt
            task-profiles-check.sha256
          if-no-files-found: warn
          retention-days: 14
